name: Quality

# The checks a change has to pass, called both by ordinary CI and by a release.
#
# A release runs exactly what a push runs. There is no shorter path that only
# the thing being published takes, because the build nobody watches is the one
# that needs the gates most.

on:
  workflow_call:

# Read-only. Nothing here publishes anything.
permissions:
  contents: read

env:
  # The toolchains the release images are built with, so a gate that passes
  # here is a gate that passed against what ships.
  NODE_VERSION: '22.23.2'
  GO_VERSION: '1.26.5'
  SHELLCHECK_IMAGE: 'koalaman/shellcheck:v0.11.0'
  ACTIONLINT_IMAGE: 'rhysd/actionlint:1.7.7'

jobs:
  control-server:
    name: Control server
    runs-on: ubuntu-24.04

    # Sessions, enrollment, revocation and the audit trail depend on real
    # constraints and real transactions, so the integration tests run against
    # PostgreSQL rather than a mock — the same version the stack ships.
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: dockplane
          POSTGRES_PASSWORD: dockplane
          POSTGRES_DB: dockplane
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready --username dockplane --dbname dockplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        working-directory: api
        run: npm ci

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Typecheck
        working-directory: api
        run: npm run typecheck

      - name: Test
        working-directory: api
        env:
          # The disposable database above. Named here rather than left to the
          # default, so a test run cannot silently reach a different one.
          DATABASE_URL: postgres://dockplane:dockplane@localhost:5433/dockplane
        run: npm test

      - name: Build
        working-directory: api
        run: npm run build

  application:
    name: Application
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Test
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

  agent:
    name: Agent
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum

      - name: Formatting
        working-directory: agent
        run: |
          unformatted="$(gofmt -l .)"

          if [[ -n "$unformatted" ]]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        working-directory: agent
        run: go vet ./...

      - name: Test
        working-directory: agent
        run: go test ./...

      # The Compose compiler is a module of its own, so `go test ./...` in the
      # agent does not reach it. It ships inside the control server image and
      # would otherwise be the one Go in the repository nothing checked.
      - name: Compose compiler formatting
        working-directory: compose-compiler
        run: |
          unformatted="$(gofmt -l .)"

          if [[ -n "$unformatted" ]]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Compose compiler vet
        working-directory: compose-compiler
        run: go vet ./...

      - name: Compose compiler tests
        working-directory: compose-compiler
        run: go test ./...

  packaging:
    name: Packaging and release scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax
        run: |
          for script in deploy/*.sh deploy/dockplane-control; do
            bash -n "$script"
          done

      - name: Shellcheck
        run: |
          docker run --rm --volume "$PWD:/mnt:ro" --workdir /mnt \
            "$SHELLCHECK_IMAGE" --severity=warning \
            deploy/*.sh deploy/dockplane-control

      - name: Installer
        run: deploy/test-installer.sh

      - name: Backup and restore
        run: deploy/test-backup-restore.sh

      - name: Upgrade safety gates
        run: deploy/test-upgrade-gates.sh

      - name: Release verification
        run: deploy/test-release-verification.sh

      - name: Tool requirements
        # A gate that cannot run its checks has to fail, not shrink. This is the
        # check on that: 0.1.0-rc.3 was verified on a machine without dpkg-deb
        # and the run was green.
        run: deploy/test-tool-requirements.sh

      - name: Release scripts
        run: deploy/test-release.sh

      - name: Documentation
        run: deploy/check-docs.sh

  website:
    name: Website
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Typecheck
        working-directory: website
        run: npm run typecheck

      - name: Test
        working-directory: website
        run: npm test

      - name: Build
        working-directory: website
        run: npm run build

      - name: The generated pages are in step with their sources
        # The changelog page and the documentation index are derived from
        # CHANGELOG.md and docs/. Both are generated before the build, so a
        # difference here means a source changed without the page following it.
        run: |
          if ! git diff --quiet -- website/src/app/pages; then
            echo "generated website data is behind its source:" >&2
            git diff --stat -- website/src/app/pages >&2
            echo >&2
            echo "run: cd website && npm run generate" >&2
            exit 1
          fi

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Actionlint
        # Held to the same shellcheck severity as the shell scripts, so one
        # policy covers both rather than two that disagree.
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
            --env SHELLCHECK_OPTS='--severity=warning' \
            "$ACTIONLINT_IMAGE" -color .github/workflows/*.yml

  browser:
    name: Browser flows
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            app/package-lock.json

      - name: Install the control server
        working-directory: api
        run: npm ci

      - name: Build the control server
        working-directory: api
        run: npm run build

      - name: Install the application
        working-directory: app
        run: npm ci

      - name: Build the application
        working-directory: app
        run: npm run build

      - name: Browsers
        working-directory: app
        run: npx playwright install --with-deps chromium firefox

      # The instance these run against is created here and destroyed with the
      # job: its own database container, its own agent authority, and an
      # administrator whose password is generated for this run. No credential
      # is configured for this workflow, and nothing here can reach a
      # deployment somebody is using.
      - name: Search palette and Add host
        working-directory: app
        run: npm run e2e
