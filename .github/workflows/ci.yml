name: CI

# Every push and every pull request. This workflow can build anything and
# publish nothing: there is no registry login, no release step, and no write
# permission to grant one.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

# A superseded run on the same branch is of no further interest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  release-build:
    name: Release build (nothing published)
    # A tag is not the moment to discover that the release build is broken. This
    # runs the same script a release runs, for one architecture, without a
    # registry and without a version anyone could mistake for a release.
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build images and bundle
        env:
          PLATFORMS: linux/amd64
          PUSH: '0'
          SBOM: '0'
        run: deploy/build-images.sh 0.0.0-ci

      - name: Tools the release checks need
        run: |
          missing=()
          command -v file > /dev/null || missing+=(file)
          command -v strings > /dev/null || missing+=(binutils)

          if [[ ${#missing[@]} -gt 0 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Build agent packages
        run: deploy/build-agent.sh 0.0.0-ci

      - name: Check agent packages
        run: deploy/check-agent-release.sh 0.0.0-ci
