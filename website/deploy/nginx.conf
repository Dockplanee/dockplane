# Serving the prerendered Dockplane website with nginx.
#
# Point `root` at the build output (dist/dockplane-website/browser) and include
# this block in a server that terminates TLS.
#
# The two things a plain static configuration gets wrong are directory URLs and
# the status code for unknown addresses: without the try_files rule below,
# /product returns 404, and without the error_page rule an unknown address
# returns 200 and becomes indexable.

root /srv/dockplane-website;
index index.html;

# /product -> /product/index.html, unknown addresses -> the 404 document.
location / {
    try_files $uri $uri/index.html $uri/ =404;
}

error_page 404 /404/index.html;

location = /404/index.html {
    internal;
}

# Build output is content-hashed and safe to cache indefinitely.
location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# HTML is revalidated so a deployment takes effect immediately.
location ~* \.html$ {
    add_header Cache-Control "public, no-cache";
}

location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600";
}

location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
}

# The site loads no third-party resources and uses no inline scripts or styles.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
